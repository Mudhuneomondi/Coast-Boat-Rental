name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read           # least privilege for the workflow token

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts          # exact versions from package-lock.json
      - run: npm audit --audit-level=high     # fails the build on known high/critical vulnerabilities
      - run: npm run build
      - name: Vendored files / SRI hashes / headers must be committed and current
        run: git diff --exit-code && npm run verify

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Load mock Supabase schemas, then schema.sql (twice → proves it is re-runnable)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/mock_supabase.sql
          psql -v ON_ERROR_STOP=1 -q -f schema.sql
          psql -v ON_ERROR_STOP=1 -q -f schema.sql
      - name: RLS / business-rule / audit tests
        run: |
          psql -q -A -t -F ' | ' -f supabase/tests/security_tests.sql | tee out.txt
          ! grep -q '^FAIL' out.txt
